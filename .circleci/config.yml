version: 2.1

executors:
  docker-and-aws:
    docker:
      - image: cimg/aws:2023.06

jobs:
  checkout_code:
    executor: docker-and-aws
    steps:
      - checkout
      - run:
          name: Verify repository contents
          command: ls -al
      - persist_to_workspace:
          root: .
          paths:
            - .

  build_image:
    executor: docker-and-aws
    steps:
      - attach_workspace:
          at: .
      - setup_remote_docker
      - run:
          name: Build Docker image
          command: |
            IMAGE_NAME="${IMAGE_REPO_NAME:-python-frontend}"
            docker build -t "${IMAGE_NAME}:build-${CIRCLE_SHA1}" .
            mkdir -p workspace/docker
            docker save "${IMAGE_NAME}:build-${CIRCLE_SHA1}" -o workspace/docker/build-image.tar
      - persist_to_workspace:
          root: workspace
          paths:
            - docker

  tag_image:
    executor: docker-and-aws
    steps:
      - attach_workspace:
          at: workspace
      - setup_remote_docker
      - run:
          name: Tag Docker image for ECR
          command: |
            IMAGE_NAME="${IMAGE_REPO_NAME:-python-frontend}"
            ECR_REGISTRY="${ECR_ACCOUNT_URL:-556809693064.dkr.ecr.us-east-1.amazonaws.com}"
            TARGET_REPO="${ECR_REGISTRY}"
            if [[ "${TARGET_REPO}" != */* ]]; then
              TARGET_REPO="${TARGET_REPO}/${IMAGE_NAME}"
            fi
            docker load -i workspace/docker/build-image.tar
            docker tag "${IMAGE_NAME}:build-${CIRCLE_SHA1}" "${TARGET_REPO}:${CIRCLE_SHA1}"
            docker tag "${IMAGE_NAME}:build-${CIRCLE_SHA1}" "${TARGET_REPO}:latest"
            docker save "${TARGET_REPO}:${CIRCLE_SHA1}" -o workspace/docker/tagged-image.tar
      - persist_to_workspace:
          root: workspace
          paths:
            - docker

  scan_image:
    executor: docker-and-aws
    steps:
      - attach_workspace:
          at: workspace
      - setup_remote_docker
      - run:
          name: Install Trivy scanner
          command: |
            curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
      - run:
          name: Scan Docker image for vulnerabilities
          command: |
            IMAGE_NAME="${IMAGE_REPO_NAME:-python-frontend}"
            ECR_REGISTRY="${ECR_ACCOUNT_URL:-556809693064.dkr.ecr.us-east-1.amazonaws.com}"
            TARGET_REPO="${ECR_REGISTRY}"
            if [[ "${TARGET_REPO}" != */* ]]; then
              TARGET_REPO="${TARGET_REPO}/${IMAGE_NAME}"
            fi
            docker load -i workspace/docker/tagged-image.tar
            trivy image --exit-code 0 --severity HIGH,CRITICAL "${TARGET_REPO}:${CIRCLE_SHA1}"

  push_image:
    executor: docker-and-aws
    steps:
      - attach_workspace:
          at: workspace
      - setup_remote_docker
      - run:
          name: Login to AWS ECR
          command: |
            ECR_REGISTRY="${ECR_ACCOUNT_URL:-556809693064.dkr.ecr.us-east-1.amazonaws.com}"
            LOGIN_REGISTRY="${ECR_REGISTRY%%/*}"
            aws ecr get-login-password --region "${AWS_DEFAULT_REGION:-us-east-1}" | docker login --username AWS --password-stdin "${LOGIN_REGISTRY}"
      - run:
          name: Push Docker images to ECR
          command: |
            IMAGE_NAME="${IMAGE_REPO_NAME:-python-frontend}"
            ECR_REGISTRY="${ECR_ACCOUNT_URL:-556809693064.dkr.ecr.us-east-1.amazonaws.com}"
            TARGET_REPO="${ECR_REGISTRY}"
            if [[ "${TARGET_REPO}" != */* ]]; then
              TARGET_REPO="${TARGET_REPO}/${IMAGE_NAME}"
            fi
            docker load -i workspace/docker/tagged-image.tar
            # Re-create the latest tag because only the SHA tag is stored in the tarball
            docker tag "${TARGET_REPO}:${CIRCLE_SHA1}" "${TARGET_REPO}:latest"
            docker push "${TARGET_REPO}:${CIRCLE_SHA1}"
            docker push "${TARGET_REPO}:latest"

workflows:
  build_and_release:
    jobs:
      - checkout_code:
          filters:
            branches:
              only:
                - circleci-project-setup
      - build_image:
          requires:
            - checkout_code
      - tag_image:
          requires:
            - build_image
      - scan_image:
          requires:
            - tag_image
      - push_image:
          requires:
            - scan_image
